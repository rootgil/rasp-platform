# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds.
# strictDepBuilds: false -> unlisted build scripts warn instead of failing the install.
strictDepBuilds: false
allowBuilds:
  '@prisma/engines': true
  esbuild: set this to true or false
  prisma: true
  sharp: false
  unrs-resolver: false
