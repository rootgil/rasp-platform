# pnpm 11 replaced onlyBuiltDependencies/ignoredBuiltDependencies with allowBuilds.
# strictDepBuilds: false -> unlisted build scripts warn instead of failing the install.
overrides:
  # Transitive via prisma/@prisma/dev (GHSA-88fw-hqm2-52qc)
  hono: '>=4.12.25'
  # Transitive via vitest / @vitejs/plugin-react (GHSA-fx2h-pf6j-xcff)
  vite: '^8.0.16'
strictDepBuilds: false
allowBuilds:
  '@prisma/engines': true
  esbuild: set this to true or false
  prisma: true
  sharp: false
  unrs-resolver: false
