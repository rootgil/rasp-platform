# Image stack — code is baked into the image (no source bind mounts).
# Use this on a VPS / when DOCKER_MODE=image.
#
# Modes (see DOCKER_MODE in .env / scripts/docker-up.sh):
#   dev   → docker-compose.yml + docker-compose.dev.yml  (hot reload + volumes)
#   image → docker-compose.yml only                      (this file)
#   prod  → docker-compose.prod.yml                      (Caddy TLS, no public 3000/4000)
#
# Local (host has pnpm):  pnpm docker:up
# Anywhere:               ./scripts/docker-up.sh up -d --build
# VPS prod:               docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#                         (do not rely on host pnpm in production)

services:

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    restart: "no"
    networks:
      - rasp-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rasp-net

  # Production Next.js image (standalone). No .:/app mount.
  app:
    build:
      context: .
      target: runner
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - rasp-net

  # Production collector image. No source mount.
  collector:
    build:
      context: ../collector
      target: runtime
    env_file: ../collector/.env
    environment:
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - rasp-net

networks:
  rasp-net:
    driver: bridge

volumes:
  redis-data:
