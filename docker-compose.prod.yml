# Production stack — reverse-proxy (Caddy) terminates TLS.
# App and collector are NOT published on the host; only Caddy exposes 80/443.
#
# Usage:
#   cp .env.production.example .env.production
#   cp ../collector/.env.production.example ../collector/.env
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Firewall: allow 80/tcp and 443/tcp only. Do NOT open 3000 or 4000.

services:

  migrate:
    build:
      context: .
      target: migrator
    env_file: .env.production
    restart: "no"
    networks:
      - rasp-net

  app:
    build:
      context: .
    env_file: .env.production
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - rasp-net

  collector:
    build:
      context: ../collector
    env_file: ../collector/.env
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - rasp-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rasp-net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
      collector:
        condition: service_healthy
    networks:
      - rasp-net

networks:
  rasp-net:
    driver: bridge

volumes:
  redis-data:
  caddy-data:
  caddy-config:
